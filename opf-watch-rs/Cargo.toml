[package]
name = "opf-watch-rs"
version = "0.1.0"
edition = "2024"
description = "Wait for new OPF Italia One Piece torrents, download them and upload to Google Drive"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
google-drive3 = "7"
librqbit = "9"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
